<!DOCTYPE html>
<html>
<head>
  <title>Something went wrong - RouteWise</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Nunito:400,700|Work+Sans:400,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F4F4F4;
      font-family: "Work Sans", "Helvetica", sans-serif;
      color: #234B52;
      padding: 20px;
    }

    .error-container {
      text-align: center;
      max-width: 480px;
    }

    .error-code {
      font-family: "Nunito", "Helvetica", sans-serif;
      font-size: 120px;
      font-weight: 700;
      color: #86d3bb;
      line-height: 1;
      margin-bottom: 16px;
    }

    .error-title {
      font-family: "Nunito", "Helvetica", sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 16px;
      color: #555;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .error-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 28px;
      background: #86d3bb;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: "Work Sans", "Helvetica", sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .error-button:hover {
      background: #6bc4a8;
    }

    .brand {
      margin-top: 48px;
      font-family: "Nunito", "Helvetica", sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #234B52;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">500</div>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-message">
      We're experiencing technical difficulties. Please try again later.
    </p>
    <a href="/" class="error-button">Back to Home</a>
    <div class="brand">RouteWise</div>
  </div>
</body>
</html>
